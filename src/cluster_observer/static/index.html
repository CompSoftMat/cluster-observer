<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cluster Status</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <div class="brand">
          <p class="eyebrow">Cluster Observer</p>
          <h1 id="dashboard-title">Cluster Status</h1>
        </div>
        <section class="summary" id="summary" aria-label="Dashboard status"></section>
        <div class="actions">
          <p id="last-updated">Waiting for first refresh.</p>
          <button id="refresh-button" class="icon-button" type="button" aria-label="Reload" title="Reload"><span aria-hidden="true">↻</span></button>
          <button id="settings-button" class="icon-button" type="button" aria-label="Settings" title="Settings"><span aria-hidden="true">⚙</span></button>
        </div>
      </section>

      <section class="workspace">
        <nav class="cluster-nav" id="cluster-nav" aria-label="Clusters"></nav>
        <section class="clusters" id="clusters"></section>
      </section>
    </main>
    <dialog id="settings-dialog" class="job-details" aria-labelledby="settings-title">
      <header class="job-details-header">
        <h2 id="settings-title">Browser settings</h2>
        <form method="dialog"><button>Close</button></form>
      </header>
      <p>Transfer saved views and per-cluster default users between browsers using a JSON file.</p>
      <button id="export-settings" type="button">Export JSON</button>
      <button id="import-settings" type="button">Import JSON</button>
      <input id="settings-file" type="file" accept=".json,application/json" hidden>
      <p id="settings-message" role="status"></p>
    </dialog>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
