[server]
dashboard_title = "Your Group Cluster Status"
host = "0.0.0.0"
port = 8080
refresh_seconds = 30
request_timeout_seconds = 20

[user_aliases]
your-username = "Your Name"
"dotted.username" = "Friendly Name"

[[clusters]]
name = "cluster-a"
host = "login.cluster-a.example"
user = "your-username"
ssh_options = ["-o", "BatchMode=yes"]
qstat_args = ["-f"]

[clusters.filter_groups.project]
project = ["your-project-code"]

[clusters.filter_groups.free_queue]
queue = ["free"]

[[clusters]]
name = "cluster-b"
host = "login.cluster-b.example"
user = "your-username"
ssh_options = ["-o", "BatchMode=yes"]
qstat_args = ["-t", "-f"]

[clusters.quota_groups.gpu_shared]
label = "gpu queue shared"
queue = "gpu_as"
covers_projects = ["project-a", "project-b"]
gpu = 8
source = "configured"
color = "manual"

[clusters.filter_groups.project]
project = ["your-project-code"]
